[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adarpro"
version = "0.1.0"
description = "Cellular-context-aware prediction of A-to-I RNA editing"
requires-python = ">=3.10"
dependencies = [
  "numpy==2.2.5",
  "pandas==2.2.3",
  "scikit-learn==1.6.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]
tables = ["pyarrow>=17"]
paper = ["CairoSVG>=2.7", "matplotlib>=3.9", "pyarrow>=17", "vtracer>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
